{% load static %}

<div class="modal-header border-bottom-0 p-3 px-4 bg-white">
    <div class="d-flex align-items-center gap-3">
        <div class="bg-teal-100 text-teal-600 p-2 rounded-lg">
            <i data-lucide="list" class="w-6 h-6"></i>
        </div>
        <div>
            <h5 class="modal-title font-weight-bold mb-0" style="font-size: 1.1rem;">{% if object %}Modifier Sous-Critère{% else %}Nouveau Sous-Critère{% endif %}</h5>
            <p class="mb-0 text-muted" style="font-size: 0.85rem;">Détails d'évaluation et cotation.</p>
        </div>
    </div>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"
        style="font-size: 1.5rem; padding: 0.8rem 1.2rem; margin: 0;">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<form id="souscritereModalForm" method="post" data-modern-form="true" class="bg-white"
    action="{% if object %}{% url 'souscritere_update' object.id %}{% else %}{% url 'souscritere_create' %}{% endif %}"
    autocomplete="off">
    {% csrf_token %}
    <div class="p-4 pt-2 pb-0 custom-scrollbar modal-body-responsive bg-white" style="padding: 15px 30px 0 30px !important;">
        {% if form.non_field_errors %}
        <div class="alert alert-danger rounded-xl mb-4 text-sm font-weight-bold">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
        </div>
        {% endif %}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="font-weight-bold text-dark mb-1.5" style="font-size: 0.85rem;" for="id_critere">Critère Parent <span
                        class="text-danger">*</span></label>
                <div class="input-group shadow-sm rounded-lg overflow-hidden border">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-white border-0 py-0 px-3">
                            <i data-lucide="link" class="w-5 h-5 text-muted"></i>
                        </span>
                    </div>
                    <select name="critere" id="id_critere" class="form-control border-0 py-0 text-sm" style="height: 42px;">
                        {% for choice in form.critere.field.choices %}
                        <option value="{{ choice.0 }}" {% if choice.0|slugify == form.critere.value|slugify %}selected{% endif %}>{{ choice.1 }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="font-weight-bold text-dark mb-1.5" style="font-size: 0.85rem;" for="id_type_cotation">Type de Cotation</label>
                <div class="input-group shadow-sm rounded-lg overflow-hidden border">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-white border-0 py-0 px-3">
                            <i data-lucide="layers" class="w-5 h-5 text-muted"></i>
                        </span>
                    </div>
                    <select name="type_cotation" id="id_type_cotation" class="form-control border-0 py-0 text-sm" style="height: 42px;">
                        {% for choice in form.type_cotation.field.choices %}
                        <option value="{{ choice.0 }}" {% if choice.0|slugify == form.type_cotation.value|slugify %}selected{% endif %}>{{ choice.1 }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="col-md-12 mb-3">
                <label class="font-weight-bold text-dark mb-1.5" style="font-size: 0.85rem;" for="id_content">Libellé du Sous-Critère <span
                        class="text-danger">*</span></label>
                <div class="input-group shadow-sm rounded-lg overflow-hidden border">
                    <textarea name="content" id="id_content" class="form-control border-0 px-3 py-3 text-sm" rows="3"
                        placeholder="Détaillez ici ce qui doit être audité..."
                        required>{{ form.content.value|default:'' }}</textarea>
                </div>
            </div>

            <div class="col-md-12 mb-3">
                <label class="font-weight-bold text-dark mb-1.5" style="font-size: 0.85rem;" for="id_reaction">Réaction attendue / Plan
                    d'action</label>
                <div class="input-group shadow-sm rounded-lg overflow-hidden border">
                    <textarea name="reaction" id="id_reaction" class="form-control border-0 px-3 py-3 text-sm" rows="3"
                        placeholder="Indiquez la réaction souhaitée en cas de non-conformité...">{{ form.reaction.value|default:'' }}</textarea>
                </div>
            </div>

            <div class="col-md-12 mb-3">
                <label class="font-weight-bold text-dark mb-1.5" style="font-size: 0.85rem;" for="id_preuve_attendu">Preuves Attendues</label>
                <div class="input-group-select2-wrapper">
                    <i data-lucide="file-text" class="select2-prefix-icon"></i>
                    <select name="preuve_attendu" id="id_preuve_attendu" class="form-control select2-multiple" multiple="multiple" data-placeholder="Sélectionner les preuves...">
                        {% for choice in form.preuve_attendu.field.choices %}
                        <option value="{{ choice.0 }}" 
                            {% if form.preuve_attendu.value %}
                                {% if choice.0|slugify in form.preuve_attendu.value|slugify %}selected{% endif %}
                            {% endif %}>
                            {{ choice.1 }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer border-top-0 p-3 px-4 d-flex justify-content-between bg-light mt-0">
        <button type="button" class="btn btn-link text-muted font-weight-bold text-decoration-none py-2"
            style="font-size: 0.95rem;" data-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-teal px-5 py-2 rounded-pill font-weight-bold text-white shadow-sm d-flex align-items-center gap-2"
            style="background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); font-size: 0.95rem;">
            <i data-lucide="save" class="w-5 h-5"></i>
            {% if object %}Enregistrer{% else %}Créer{% endif %}
        </button>
    </div>
</form>

<script>
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }

    function initSelect2Fields() {
        if ($.fn.select2) {
            // Target the multi-select fields specifically
            $('#id_preuve_attendu, #id_type_audit, .select2-multiple').each(function () {
                var $this = $(this);
                var placeholderText = $this.attr('data-placeholder') || 'Sélectionner...';
                var $modal = $this.closest('.modal');
                
                if ($this.hasClass('select2-hidden-accessible')) {
                    $this.select2('destroy');
                }

                $this.select2({
                    theme: 'bootstrap4',
                    width: '100%',
                    dropdownParent: $modal.length ? $modal : $('body'),
                    placeholder: placeholderText,
                    allowClear: true,
                    // Force the selection box to look like a single line
                    containerCssClass: 'modern-select2-container',
                    dropdownCssClass: 'modern-select2-dropdown'
                });
            });
        } else {
            console.error("Select2 library not found.");
        }
    }

    // Initialize immediately
    $(document).ready(function() {
        initSelect2Fields();
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    // Re-initialize once the modal is fully shown
    $('#souscritereModal').on('shown.bs.modal', function () {
        initSelect2Fields();
    });

    // Auto-fill Type d'Audit based on chosen Critere Parent
    $('#id_critere').on('change', function () {
        var critereId = $(this).val();
        if (critereId) {
            $.ajax({
                url: '/audit/api/critere/' + critereId + '/type-audits/',
                method: 'GET',
                success: function (response) {
                    if (response.status === 'success') {
                        // Pre-select the returned type audits
                        $('#id_type_audit').val(response.type_audits).trigger('change');
                    }
                },
                error: function (err) {
                    console.error("Erreur de récupération des types d'audit:", err);
                }
            });
        } else {
            $('#id_type_audit').val(null).trigger('change');
        }
    });

    // Run once on load just in case a critere is pre-selected and we need to inherit
    $(document).ready(function () {
        if ($('#id_critere').val() && !$('#id_type_audit').val().length) {
            $('#id_critere').trigger('change');
        }
    });
</script>

<style>
    /* Modal Size & Centering */
    #souscritereModal .modal-dialog {
        /* Removed max-width to allow modal-lg from list page to take effect */
    }

    .modal-content {
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        border-radius: 16px;
        border: none !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .text-xs { font-size: 0.85rem; }

    /* Natural body: no calc, no forced height */
    .modal-body-responsive {
        flex: 0 0 auto !important;          /* ❗ no stretching */
        overflow: visible !important;       /* ❗ no forced scroll */
        padding-bottom: 4px !important;
        min-height: 0 !important;
    }

    /* Force kill any persisting gap from children */
    #souscritereModal .modal-body-responsive > *:last-child {
        margin-bottom: 0 !important;
    }

    /* Only activate scroll WHEN needed */
    @media (max-height: 700px) {
        #souscritereModal .modal-body-responsive {
            flex: 1 1 auto !important;
            overflow-y: auto !important;
        }
    }

    #souscritereModal .modal-footer {
        padding: 15px 25px !important;
        background-color: #f8fafc !important;
    }

    /* --- PREMIUM COMPACT SELECT2 OVERRIDES --- */
    
    /* 1. The main selection container */
    .select2-container--bootstrap4 .select2-selection--multiple {
        min-height: 46px !important;
        height: 46px !important; /* Force matching height */
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
        background-color: #fff !important;
        display: flex !important;
        align-items: center !important;
        padding: 0 12px 0 45px !important; /* Leave room for the absolute icon */
        transition: all 0.2s ease !important;
        overflow: hidden !important;
    }

    /* 2. Position the prefix icon correctly */
    .input-group-select2-wrapper {
        position: relative !important;
        width: 100% !important;
    }
    
    .select2-prefix-icon {
        position: absolute !important;
        left: 15px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        z-index: 10 !important;
        pointer-events: none !important;
        color: #94a3b8 !important;
        width: 18px !important;
        height: 18px !important;
    }

    /* 3. The rendered choices/chips */
    .select2-container--bootstrap4 .select2-selection--multiple .select2-selection__rendered {
        display: flex !important;
        flex-wrap: nowrap !important; /* Keep it single line if possible or very compact */
        gap: 6px !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        align-items: center !important;
        overflow-x: auto !important; /* Allow internal horizontal scroll if too many chips */
    }
    
    /* Hide scrollbar for chips */
    .select2-selection__rendered::-webkit-scrollbar { display: none; }

    .select2-container--bootstrap4 .select2-selection--multiple .select2-selection__choice {
        background-color: #f1f5f9 !important;
        border: 1px solid #e2e8f0 !important;
        color: #475569 !important;
        font-size: 13px !important;
        border-radius: 8px !important;
        margin: 0 !important;
        padding: 2px 8px !important;
        display: flex !important;
        align-items: center !important;
        max-width: 150px !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        white-space: nowrap !important;
    }

    .select2-container--bootstrap4 .select2-selection--multiple .select2-selection__choice__remove {
        color: #ef4444 !important;
        margin-right: 6px !important;
        font-size: 16px !important;
    }

    /* 4. Placeholder styling */
    .select2-container--bootstrap4 .select2-selection--multiple .select2-search--inline .select2-search__field {
        margin: 0 !important;
        height: 100% !important;
        font-size: 14px !important;
        font-family: inherit !important;
        color: #94a3b8 !important;
    }

    /* 5. The Dropdown Results Menu */
    .select2-container--bootstrap4 .select2-dropdown {
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        margin-top: 5px !important;
        overflow: hidden !important;
    }

    .select2-container--bootstrap4 .select2-results__options {
        max-height: 180px !important; /* User requirement */
        padding: 4px !important;
    }

    .select2-results__option {
        padding: 8px 12px !important;
        font-size: 14px !important;
        border-radius: 8px !important;
        margin-bottom: 2px !important;
    }

    .select2-container--bootstrap4 .select2-results__option--highlighted[aria-selected] {
        background-color: #0d9488 !important; /* Teal to match theme */
    }

    /* Focus state */
    .select2-container--bootstrap4.select2-container--focus .select2-selection {
        border-color: #0d9488 !important;
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1) !important;
    }

    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>
